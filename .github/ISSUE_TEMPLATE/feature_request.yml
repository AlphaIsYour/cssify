name: Feature or Generator Request
description: Propose a new CSS generator, preset, or enhancement for Eno CSS Playground.
title: "feat: [Short summary of the proposed feature]"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We love suggestions for new CSS tools, presets, or UI improvements!
  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      description: What category does this proposal fit into?
      options:
        - Brand New CSS Generator (e.g., Animation Keyframes, Clip-Path, CSS Grid Area)
        - New Presets for Existing Generator
        - Developer Experience (DX) / Tooling
        - Accessibility / Responsive UI
        - Export / Sharing Feature
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is.
      placeholder: "I find it challenging to visually design..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the Solution You'd Like
      description: A clear and concise description of what you want to happen.
      placeholder: "Add an interactive control where users can..."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or Additional Context
      description: Have you considered any alternative solutions? Add links, CSS specs, or mockups here.
  - type: checkboxes
    id: willing_to_contribute
    attributes:
      label: Contribution
      options:
        - label: I would be interested in working on this feature or opening a Pull Request!
